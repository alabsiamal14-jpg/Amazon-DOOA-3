<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>متجر التجميل والعناية بالذكاء الاصطناعي</title>
    <meta name="description" content="متجر منتجات تجميل وعناية فاخر متكامل مع تحليل المنتجات بالذكاء الاصطناعي Gemini، لوحة تحكم لإضافة وتعديل المنتجات، وسلة تسوق مع إتمام الطلب المباشر عبر واتساب." />
    <meta property="og:title" content="متجر التجميل والعناية بالذكاء الاصطناعي" />
    <meta property="og:description" content="متجر منتجات تجميل وعناية فاخر متكامل مع تحليل المنتجات بالذكاء الاصطناعي Gemini، لوحة تحكم لإضافة وتعديل المنتجات، وسلة تسوق مع إتمام الطلب المباشر عبر واتساب." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e11d48" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-50 text-stone-900 font-['Cairo',sans-serif] antialiased selection:bg-rose-100 selection:text-rose-900 min-h-screen">
    <div id="root"></div>
    <script>
      (function () {
        var RECOVERY_KEY = 'amazon_duaa_boot_recovered_v1';
        async function clearSwAndCaches() {
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
          } catch (_) {}
          try {
            if ('caches' in window && caches.keys) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (_) {}
        }
        async function attemptAutoRecover() {
          try {
            if (sessionStorage.getItem(RECOVERY_KEY)) return;
            sessionStorage.setItem(RECOVERY_KEY, '1');
            await clearSwAndCaches();
            window.location.reload();
          } catch (_) {}
        }
        window.addEventListener('vite:preloadError', function (event) {
          if (event && event.preventDefault) event.preventDefault();
          void attemptAutoRecover();
        });
        window.addEventListener('error', function (event) {
          var target = event && event.target;
          if (!target) return;
          var tag = target.tagName;
          var src = target.src || target.href || '';
          if ((tag === 'SCRIPT' || tag === 'LINK') && src.indexOf('/assets/') !== -1) {
            void attemptAutoRecover();
          }
        }, true);
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          root.innerHTML =
            '<div dir="rtl" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Cairo,sans-serif;background:#fafaf9;color:#1c1917;">' +
              '<div style="max-width:420px;width:100%;background:#fff;border:1px solid #fecdd3;border-radius:24px;padding:28px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.06);">' +
                '<h2 style="margin:0 0 10px;font-size:20px;font-weight:900;">جاري استعادة عرض المتجر</h2>' +
                '<p style="margin:0 0 18px;font-size:13px;line-height:1.7;color:#57534e;">تعذر تحميل بعض ملفات الواجهة بسبب ذاكرة مؤقتة قديمة في المتصفح. اضغط على الزر بالأسفل لتحديث النسخة الجديدة فوراً.</p>' +
                '<button id="amazon-duaa-boot-retry" type="button" style="background:#e11d48;color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:13px;font-weight:800;cursor:pointer;">تحديث المتجر ومسح الذاكرة المؤقتة</button>' +
              '</div>' +
            '</div>';
          var btn = document.getElementById('amazon-duaa-boot-retry');
          if (btn) {
            btn.addEventListener('click', function () {
              try { sessionStorage.removeItem(RECOVERY_KEY); } catch (_) {}
              clearSwAndCaches().finally(function () { window.location.reload(); });
            });
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
